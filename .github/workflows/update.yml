name: Update dashboard

# Runs on GitHub's servers, so updates happen even when your PC is off.
on:
  schedule:
    # Target: 9pm UK time, every day, year-round. GitHub cron is UTC-only and
    # 9pm London is 20:00 UTC in summer (BST) but 21:00 UTC in winter (GMT) -
    # so BOTH hours are scheduled and the gate job below runs the one where
    # it is actually 21:00 in London, skipping the shadow. Minute :17 because
    # on-the-hour crons are GitHub's most congested slot and get delayed most.
    - cron: "17 20 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch: {}         # lets you run it on demand from the Actions tab
  repository_dispatch:
    types: [refresh]            # the site's "Refresh now" button, via the worker
  push:
    paths:
      - "data/captures/**"      # a contribution upload rebuilds the site
      # Code/template/asset changes republish the site too — these runs SKIP the
      # slow FACEIT fetch (see DO_FETCH below) and just re-export from the cached
      # DB, so a dashboard tweak goes live in seconds without a manual dispatch.
      - "faceit_sync/**"
      - "owdb/**"
      - "tools/**"
      - "docs/capture/**"
      - "refs.json"
      - "matches.txt"

permissions:
  contents: write               # allow committing the rebuilt dashboard

concurrency:                    # never let two runs overlap
  group: update-dashboard
  cancel-in-progress: false

jobs:
  # Which of the two daily crons is really 9pm in London? (Manual runs and
  # data pushes always proceed.)
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          # Always compute and log, even on manual runs: this line is the only
          # evidence that the runner's timezone database resolves at all. If it
          # ever prints a London hour equal to the UTC hour in SUMMER, tzdata is
          # missing and the gate would silently skip every scheduled run.
          utc=$(date -u "+%Y-%m-%d %H:%M UTC")
          london=$(TZ=Europe/London date "+%Y-%m-%d %H:%M %Z")
          hour=$(TZ=Europe/London date +%H)
          echo "now: $utc  ->  London: $london  (hour=$hour)"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual/push run - proceeding regardless of the hour"
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$hour" = "21" ]; then
            echo "this is the 9pm London slot - running"
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "shadow slot (the other cron is the real 9pm today) - skipping"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: which contributor owns a contested map is decided by
          # the commit that ADDED their file, and a shallow clone cannot see it
          # (every file would look equally old and silently fall back to name
          # order). See git_submission_order in owdb/contribute.py.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Persist the SQLite DB across runs so updates are incremental (only new
      # matches are fetched). A cache miss self-heals: the seed list below
      # rebuilds every division from scratch via transitive discovery.
      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: faceit.sqlite3
          key: faceit-db-${{ github.run_id }}
          restore-keys: faceit-db-

      - name: Install the tool
        run: pip install -e .

      - name: Update all divisions + rebuild dashboard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # FRESH data from FACEIT (the slow, rate-limited part) is only needed for
          # the daily schedule, a manual run, or the site's "Refresh now" button.
          # A code/template push or a contribution upload just re-exports from the
          # cached DB - seconds, not minutes. A missing cache self-heals below by
          # forcing a full fetch (the seed list rebuilds every division from
          # scratch via transitive discovery).
          DO_FETCH=false
          case "$EVENT" in schedule|workflow_dispatch|repository_dispatch) DO_FETCH=true;; esac
          if [ ! -s faceit.sqlite3 ]; then DO_FETCH=true; echo "no cached DB - forcing a full fetch"; fi
          if [ "$DO_FETCH" = "true" ]; then
            # Seed known teams from the committed match list (idempotent), then let
            # the keyless enumerator discover and ingest every finished league match
            # across all divisions. Already-stored finished matches are skipped -
            # EXCEPT the two cases that can still gain a replay code: a match with
            # a partial gap (some games have codes) within --backfill-days, and any
            # match ingested in the last 12 hours. Matches with no code on any game
            # are permanently code-less and are not re-fetched.
            # A stray unreachable match must not block the daily dashboard update,
            # so fetch errors are tolerated; the export must still succeed.
            faceit-sync --db faceit.sqlite3 fetch --matches-file matches.txt || echo "seed: some matches errored (continuing)"
            faceit-sync --db faceit.sqlite3 fetch || echo "update: some matches errored (continuing)"
            # Fill Battle.net game_name for scoutable matches so player attribution
            # matches the HUD (the HUD shows the game name, not the FACEIT nickname).
            # Cheap + idempotent: only coded matches still missing it.
            faceit-sync --db faceit.sqlite3 backfill-gamenames || echo "backfill: some matches errored (continuing)"
          else
            echo "push event ($EVENT) - skipping FACEIT fetch; re-exporting from the cached DB"
          fi
          # THE season this run publishes. The pin is s10; resolve-season returns
          # it once S10 has matches and the newest season that does until then, so
          # the site carries on through the boundary and switches itself over on
          # the first PLAYED S10 match (a seeded room is not a played season).
          # Merge and export both read this one
          # value: a page whose standings and captured comps came from different
          # seasons is the exact commingling the pin exists to prevent.
          SEASON="$(faceit-sync --db faceit.sqlite3 resolve-season --season s10 || echo s10)"
          echo "publishing season: $SEASON"
          # Scouting data arrives as RAW OBSERVATIONS, one file per contributor
          # under data/captures/<season>/ (season-scoped, so one season's captures
          # never mix into another's). Merge them here rather than committing a
          # derived payload: the report is then always computed by the current
          # analysis, so improvements apply retroactively to every past contribution.
          # First-wins on a contested map, ordered by commit date (a contributor
          # cannot vote on their own priority) - see owdb/contribute.py.
          if [ -n "$(ls -A "data/captures/$SEASON"/*.json 2>/dev/null)" ]; then
            owdb --faceit-db faceit.sqlite3 contribute merge --dir "data/captures/$SEASON" --out owdb_comps.json --captured-out docs/captured.json
          else
            echo "no contributions for $SEASON yet - dashboard will build without captured comps"
          fi
          # docs/index.html is the LIVE SITE and this job is its only writer.
          # export reads owdb_comps.json from the repo root.
          # No --region: the site ships EVERY division the DB holds, as switchable
          # views grouped by region (EMEA Master/Expert/Advanced + Combined, then
          # NA Master/Expert + Combined). Pass --region emea|na to narrow it again.
          # --season is the resolved season above, not a second pin, so the page
          # and the comps merged into it can never disagree. Past seasons live at
          # docs/s<n>/ as frozen exports — see
          # specs/2026-08-10-season10-cutover-design.md.
          faceit-sync --db faceit.sqlite3 export --season "$SEASON" --format html --out docs/index.html
          # Codes + rosters feed for the browser capture app (docs/capture/). It
          # CONSUMES this instead of crawling FACEIT; refs.json is curator-committed.
          python tools/build_capture_data.py || echo "capture feed: skipped"

      - name: Publish downloadable DB snapshot
        run: |
          # A fresh owdb.exe downloads THIS instead of re-crawling ~2,100
          # rate-limited FACEIT calls (minutes of 429 backoffs) to rebuild what
          # this job just built. VACUUM compacts; gzip mtime=0 keeps the output
          # byte-identical when the data is unchanged, so quiet days don't churn.
          python - <<'PY'
          import gzip, os, sqlite3
          snap = "docs/faceit.snapshot.sqlite3"
          if os.path.exists(snap):
              os.remove(snap)
          con = sqlite3.connect("faceit.sqlite3")
          con.execute("VACUUM INTO ?", (snap,))
          con.close()
          with open(snap, "rb") as src, \
               gzip.GzipFile("docs/faceit.sqlite3.gz", "wb", compresslevel=9, mtime=0) as dst:
              dst.write(src.read())
          os.remove(snap)
          print("snapshot:", os.path.getsize("docs/faceit.sqlite3.gz"), "bytes")
          PY

      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: faceit.sqlite3
          key: faceit-db-${{ github.run_id }}

      - name: Publish if the dashboard changed
        run: |
          git config user.name  "faceit-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/captured.json docs/faceit.sqlite3.gz docs/capture/data.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to publish."
          else
            git commit -m "Auto-update dashboard ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "Published updated dashboard."
          fi
