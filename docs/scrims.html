<script>
// Apply the remembered palette before first paint (no flash). Shares the
// dashboard's owdb.palette localStorage key (same origin) — pick a palette
// on one page, it carries to the others. Palette-only: this page follows its
// capture-side twin and stays dark, no light/dark override.
(function(){try{
  var p=localStorage.getItem('owdb.palette');
  if(['violet','ocean','forest','sunset','teal','overwatch'].indexOf(p)>=0) document.documentElement.setAttribute('data-palette',p);
  else document.documentElement.setAttribute('data-palette','original');
}catch(e){}})();
</script>

/* date range */

/* opponent identity */

.oppmeta{color:var(--faint);font-weight:400;font-size:12px}

  /* Section label inside a card. Was used before it was ever defined, so these

/* demo banner — must not be mistakable for real data */

<script>
// ---- scrim lock ----
// Scrim capture is merged but not open. The overlay above is STATIC MARKUP;
// this script only ever REMOVES it. That direction is the whole design: a
// syntax error here, a CSP block, localStorage disabled, an exception - any
// of it leaves the page locked. A gate that added the overlay instead would
// fail open, and an unfinished capture tool reaching everyone is the outcome
// worth engineering against.
//
// It is a soft gate, not a security boundary. The token is readable in this
// file by anyone who looks; the point is that nobody arrives here by accident,
// not that it cannot be bypassed. Nothing behind it is secret - it writes only
// to the visitor's own browser.
//
// Unlock once per browser with ?unlock=scrimbeta (it persists), re-lock with
// ?lock=1. There is deliberately NO localhost exemption: a dev bypass would
// mean the state that ships is the one state nothing ever exercises, and
// tools/verify_capture_browser.js serves over 127.0.0.1. One token, one code
// path, checked in a browser.
//
// Kept byte-identical on docs/capture/scrim.html and docs/scrims.html - one
// records scrims and the other reads them, so unlocking either alone ships
// half a feature. A test compares them.
(function(){
  try{
    var KEY='owdb_scrim_unlock', TOKEN='scrimbeta';
    var q=new URLSearchParams(location.search);
    if(q.get('lock')) localStorage.removeItem(KEY);
    else if(q.get('unlock')) localStorage.setItem(KEY, q.get('unlock'));
    if(localStorage.getItem(KEY)===TOKEN){
      var el=document.getElementById('scrimpaused');
      if(el) el.remove();
    }
  }catch(e){ /* stay locked */ }
})();
</script>

<script src="capture/engine/heroes.js"></script>
<script>
// ---------- tiny helpers ----------
const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const esc = (s)=> (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dshort = (s)=> s? String(s).slice(0,10) : '?';
let GUID_TO_NAME = {};
let HERO_ROLE = {};

// ---------- hero roles ----------
// ROLE_MAP and inferRole live in capture/engine/heroes.js, loaded above: the
// capture page's ban picker groups by role too, and a second hand-kept copy of
// this table would be a second chance for it to drift from
// faceit_sync/subroles.py - which the first copy had already done silently.
// This page is otherwise self-contained; that one script tag is the exception,
// and it is a plain data module with no DOM or IndexedDB reach.
const {ROLE_MAP, inferRole} = OWDBHeroes;

// ---------- IndexedDB ----------
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('owscout-capture');
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function idbGetAll(store){
  const db = await openDB();
  if(!db.objectStoreNames.contains(store)) return [];
  return new Promise(res=>{
    const rq = db.transaction(store,'readonly').objectStore(store).getAll();
    rq.onsuccess = ()=> res(rq.result||[]);
    rq.onerror = ()=> res([]);
  });
}

// ---------- load refs.json for hero name resolution ----------
async function loadRefs(){
  try{
    const r = await fetch('capture/refs.json',{cache:'no-store'});
    const j = await r.json();
    for(const ref of (j.refs||[])){ if(ref.g && ref.n) GUID_TO_NAME[ref.g] = ref.n; }
    // also check for any custom heroes in IndexedDB
    try{
      const heroes = await idbGetAll('heroes');
      for(const h of heroes){ if(h.g && h.name) GUID_TO_NAME[h.g] = h.name; }
    }catch(e){}
  }catch(e){
    console.warn('Could not load refs.json:', e);
  }
  // infer roles
  for(const [g,n] of Object.entries(GUID_TO_NAME)){
    const role = inferRole(n);
    if(role) HERO_ROLE[g] = role;
  }
}

function heroName(guid){
  if(!guid) return '?';
  if(GUID_TO_NAME[guid]) return GUID_TO_NAME[guid];
  return '0x'+guid.slice(2,10)+'…';
}

function heroRoleClass(guid){
  const r = HERO_ROLE[guid];
  return r ? 'role-'+r : '';
}

// ---------- data processing ----------
// ---------- demo mode ----------
// ?demo=1 renders a sample block instead of this browser's scrims, so an empty
// page can show what a filled-in one looks like. It reads through the SAME
// rendering path as real data - a separate mock page would drift and prove
// nothing about the real one.
//
// It never touches IndexedDB. Someone trying the demo must not end up with
// invented scrims in their own database.
const DEMO = new URLSearchParams(location.search).get('demo')==='1';
let DEMO_NOTE = '';
// Dates are stored as @@MINUSn@@ so the sample always looks recent rather than
// ageing into "played 200 days ago" the moment it is committed.
function demoDate(v){
  const m = /^@@MINUS(\d+)@@/.exec(String(v||''));
  if(!m) return v;
  const d = new Date(Date.now() - (+m[1])*86400000).toISOString().slice(0,10);
  return String(v).replace(/^@@MINUS\d+@@/, d);
}
async function loadDemo(){
  const r = await fetch('scrims-demo.json', {cache:'no-store'});
  const d = await r.json();
  DEMO_NOTE = d.note||'';
  const fix = o => { const c = {...o}; if(c.date) c.date = demoDate(c.date);
                     if(c.created_at) c.created_at = demoDate(c.created_at); return c; };
  OPPONENTS = {};
  (d.opponents||[]).forEach(o=>{ OPPONENTS[o.id]=o; });
  return { scrims:(d.scrims||[]).map(fix), maps:(d.scrim_maps||[]).map(fix) };
}

async function loadData(){
  await loadRefs();
  if(DEMO){
    const {scrims, maps} = await loadDemo();
    scrims.sort((a,b)=> (b.created_at||'').localeCompare(a.created_at||''));
    const mapsByScrim = {};
    for(const m of maps){ (mapsByScrim[m.scrim_id] = mapsByScrim[m.scrim_id]||[]).push(m); }
    for(const id in mapsByScrim) mapsByScrim[id].sort((a,b)=>(a.map_no||0)-(b.map_no||0));
    return {scrims, maps, mapsByScrim};
  }
  await loadOpponents();
  const scrims = await idbGetAll('scrims');
  const maps = await idbGetAll('scrim_maps');
  // Sort scrims newest first
  scrims.sort((a,b)=> (b.created_at||'').localeCompare(a.created_at||''));
  // Index maps by scrim_id
  const mapsByScrim = {};
  for(const m of maps){
    if(!mapsByScrim[m.scrim_id]) mapsByScrim[m.scrim_id] = [];
    mapsByScrim[m.scrim_id].push(m);
  }
  // Sort maps within each scrim by map_no
  for(const id in mapsByScrim){
    mapsByScrim[id].sort((a,b)=> (a.map_no||0)-(b.map_no||0));
  }
  return {scrims, maps, mapsByScrim};
}

function countObservations(map){
  let total = 0;
  for(const o of (map.observations||[])){
    total += (o.heroes||[]).filter(Boolean).length;
  }
  return total;
}

function heroFrequency(observations, sideFilter){
  const counts = {};
  for(const o of observations){
    if(sideFilter && o.side!==sideFilter) continue;
    for(const g of (o.heroes||[])){
      if(!g) continue;
      counts[g] = (counts[g]||0)+1;
    }
  }
  return Object.entries(counts).sort((a,b)=> b[1]-a[1]);
}

function uniqueHeroes(observations, sideFilter){
  const set = new Set();
  for(const o of observations){
    if(sideFilter && o.side!==sideFilter) continue;
    for(const g of (o.heroes||[])){
      if(g) set.add(g);
    }
  }
  return [...set];
}

function totalObservations(observations, sideFilter){
  let n = 0;
  for(const o of observations){
    if(sideFilter && o.side!==sideFilter) continue;
    n += (o.heroes||[]).filter(Boolean).length;
  }
  return n;
}

function allObservations(maps){
  return [].concat(...maps.map(m=>m.observations||[]));
}

// Every mode a scrim can be played on. Listed rather than derived from the
// captured maps, because the whole point is showing the mode you HAVEN'T
// touched - deriving it from what exists would hide exactly that.
const SCRIM_MODES = ['Control','Escort','Hybrid','Push','Flashpoint'];

// mapCoverage(scrims, maps, today) — what have we actually been practising?
// Per mode: how many maps, when last, and how long ago. Answers "we haven't
// played Push in three weeks", which is the practice-log question the design
// names and the reason this page is more than a capture archive.
//
// Voided maps are excluded: a restarted map was not practice, and counting it
// would say you covered a mode you actually abandoned.
// Every map in the competitive pool, by mode. Listed for the same reason the
// modes are: showing that you have played Ilios four times and Nepal never is
// the point, and deriving the list from captured maps would hide Nepal.
const POOL = {
  Control: ['Antarctic Peninsula','Busan','Ilios','Lijiang Tower','Nepal','Oasis','Samoa'],
  Escort: ['Circuit Royal','Dorado','Havana','Junkertown','Rialto','Route 66','Shambali Monastery','Watchpoint: Gibraltar'],
  Hybrid: ['Blizzard World','Eichenwalde','Hollywood',"King's Row",'Midtown','Numbani','Paraiso'],
  Push: ['Colosseo','Esperanca','New Queen Street','Runasapi'],
  Flashpoint: ['New Junk City','Suravasa'],
};

function mapCoverage(scrims, maps, today){
  const dateOf = {};
  (scrims||[]).forEach(s=>{ dateOf[s.id] = s.date || (s.created_at||'').slice(0,10); });
  const acc = {};
  SCRIM_MODES.forEach(m=>{
    acc[m] = {mode:m, games:0, last:null, maps:{}};
    (POOL[m]||[]).forEach(name=>{ acc[m].maps[name] = 0; });
  });
  (maps||[]).forEach(m=>{
    if(m.void) return;
    const cat = m.map_category;
    if(!acc[cat]) acc[cat] = {mode:cat, games:0, last:null, maps:{}};   // an unexpected mode still shows
    acc[cat].games++;
    if(m.map_name) acc[cat].maps[m.map_name] = (acc[cat].maps[m.map_name]||0)+1;
    const d = dateOf[m.scrim_id] || '';
    if(d && (!acc[cat].last || d > acc[cat].last)) acc[cat].last = d;
  });
  const now = today || new Date().toISOString().slice(0,10);
  const out = Object.values(acc);
  out.forEach(c=>{
    c.days = c.last ? Math.max(0, Math.round((Date.parse(now)-Date.parse(c.last))/86400000)) : null;
  });
  // Least-practised first: never-played at the top, then longest since.
  out.sort((a,b)=>{
    if(a.games===0 && b.games!==0) return -1;
    if(b.games===0 && a.games!==0) return 1;
    return (b.days==null?-1:b.days)-(a.days==null?-1:a.days);
  });
  return out;
}

// A mode untouched for this long is worth pointing at. Three weeks is a guess,
// not a measurement - it is a nudge, so it only has to be roughly right.
const STALE_DAYS = 21;

function coverageStrip(scrims, maps){
  const cov = mapCoverage(scrims, maps);
  if(!cov.some(c=>c.games)) return '';
  const cell = c => {
    const state = c.games===0 ? 'never' : (c.days>=STALE_DAYS ? 'stale' : 'ok');
    const when = c.games===0 ? 'never played'
      : c.days===0 ? 'today' : c.days===1 ? 'yesterday' : c.days+' days ago';
    // Per-map counts inside the mode: the mode total hides that you have played
    // Ilios four times and never touched Nepal, which is the gap worth seeing.
    const names = Object.keys(c.maps||{}).sort((a,b)=>
      (c.maps[b]-c.maps[a]) || a.localeCompare(b));
    const rows = names.map(n=>`<div class="covmap${c.maps[n]?'':' covmap0'}">
        <span class="cmn">${esc(n)}</span><span class="cmv">${c.maps[n]||'·'}</span></div>`).join('');
    return `<div class="covcell cov-${state}">
      <div class="covmode">${esc(c.mode)}</div>
      <div class="covn">${c.games||'—'}</div>
      <div class="covwhen">${esc(when)}</div>
      ${rows?`<div class="covmaps">${rows}</div>`:''}
    </div>`;
  };
  const gaps = cov.filter(c=>c.games===0 || c.days>=STALE_DAYS);
  const note = gaps.length
    ? `<div class="covnote">Least practised: <b>${gaps.slice(0,3).map(c=>esc(c.mode)).join(', ')}</b></div>`
    : `<div class="covnote">Every mode practised in the last ${STALE_DAYS} days.</div>`;
  return `<div class="section-h"><h2>Practice coverage</h2></div>
    <div class="covgrid">${cov.map(cell).join('')}</div>${note}`;
}

// ---------- comp analysis ----------
// The same semantics the league Scout pages use (owdb/analysis.py), reimplemented
// here because this page has no build step and no server: a comp is a FAMILY, not
// an exact five, and a hero pool is counted in ROUNDS, not maps. Counting maps
// flattens "played every round" and "played for one point" to the same "1 map",
// which is the difference between a staple and a one-off.
//
// `roles` is guid -> 'Tank'|'Damage'|'Support' (matched case-insensitively), passed
// in rather than read from the page global so these stay pure and testable.

// An observation's round. The capture page writes `round_no`; older records and
// hand-built fixtures may carry `round`. Missing means the map was never
// segmented, which is one round, not zero.
function obsRound(o){
  if(o.round_no!=null) return o.round_no;
  if(o.round!=null) return o.round;
  return 1;
}

// A segment is the unit a comp is actually chosen for: the sub-map on Control,
// the attack/defend phase on Escort and Hybrid, and the whole map otherwise.
// Push and Flashpoint are mirrored, so both teams play the same thing.
function segmentOf(map, o){
  const cat = map.map_category||'';
  if(cat==='Control') return o.sub_map || ('Point '+obsRound(o));
  if(cat==='Escort'||cat==='Hybrid'){
    if(o.phase==='attack') return 'Attack';
    if(o.phase==='defend') return 'Defend';
  }
  return 'Map';
}

// A lineup, deduplicated. The hero limit is always on in 5v5, so the same hero
// appearing twice is a misread (one portrait matched two slots), never a real
// lineup — and left in, it would let sameComp count one shared hero twice and
// fold unrelated comps together.
function lineupOf(o){
  const seen = {}, out = [];
  for(const g of (o.heroes||[])){
    if(!g || seen[g]) continue;
    seen[g] = 1; out.push(g);
  }
  return out.sort();
}

// A side is five players. More than that after dedup is a read that cannot be
// true, and there is no way to tell which portrait is the spurious one — so the
// snapshot is dropped rather than allowed to invent a sixth pick.
const MAX_LINEUP = 5;
function usableObs(o){
  const n = lineupOf(o).length;
  return n > 0 && n <= MAX_LINEUP;
}

// One side's observations on one map, in the order they were played. Empty
// snapshots are dropped: a frame where nothing read is not a lineup change.
function sideObs(map, side){
  return (map.observations||[])
    .filter(o=> o.side===side && usableObs(o))
    .map((o,i)=> ({o, i}))
    .sort((x,y)=> (obsRound(x.o)-obsRound(y.o)) || ((x.o.ts||0)-(y.o.ts||0)) || (x.i-y.i))
    .map(x=> x.o);
}

function tankOf(lineup, roles){
  for(const h of lineup){ if(String(roles[h]||'').toLowerCase()==='tank') return h; }
  return null;
}

// Two lineups are the same comp family if they share >=4 heroes, or exactly 3
// including the same tank — the tank anchors identity in 5v5. This relation is
// deliberately not transitive, which is why clustering below is greedy.
function sameComp(a, b, roles){
  const sb = new Set(b);
  // Distinct shared heroes. Counting a repeat twice would clear the >=4 bar on
  // three real heroes and fold two different comps into one family.
  const shared = [...new Set(a)].filter(h=> sb.has(h));
  if(shared.length>=4) return true;
  if(shared.length===3){
    const ta = tankOf(a, roles);
    return !!ta && shared.indexOf(ta)>=0 && tankOf(b, roles)===ta;
  }
  return false;
}

// instances: [{heroes:[guid], mapKey, result:'win'|'loss'|'draw'|null}]
// The most-frequent lineup anchors a family and absorbs the lineups matching it.
// W-L is counted over distinct MAPS, not instances: a three-segment map that a
// team opened the same way each time is one win, not three.
function clusterComps(instances, roles){
  const freq = {};
  instances.forEach(i=>{
    const k = i.heroes.join(',');
    if(!freq[k]) freq[k] = {heroes:i.heroes, n:0};
    freq[k].n++;
  });
  const order = Object.keys(freq).sort((a,b)=> freq[b].n-freq[a].n || a.localeCompare(b));
  const assigned = new Set();
  const fams = [];
  for(const anchor of order){
    if(assigned.has(anchor)) continue;
    const members = new Set([anchor]);
    assigned.add(anchor);
    for(const other of order){
      if(assigned.has(other)) continue;
      if(sameComp(freq[anchor].heroes, freq[other].heroes, roles)){
        members.add(other); assigned.add(other);
      }
    }
    const insts = instances.filter(i=> members.has(i.heroes.join(',')));
    const resultByMap = {};
    insts.forEach(i=>{ resultByMap[i.mapKey] = i.result; });
    let wins=0, losses=0, draws=0;
    Object.keys(resultByMap).forEach(k=>{
      const r = resultByMap[k];
      if(r==='win') wins++; else if(r==='loss') losses++; else if(r==='draw') draws++;
    });
    fams.push({
      heroes: freq[anchor].heroes,
      samples: insts.length,
      maps: Object.keys(resultByMap).length,
      wins, losses, draws,
      variants: [...members].map(k=> freq[k].heroes),
    });
  }
  fams.sort((a,b)=> (b.maps-a.maps) || (b.samples-a.samples));
  return fams;
}

// One instance per segment: the lineup they OPENED that segment on. Openers are
// what a scout can act on — the settled comp is a response to what happened.
function compInstances(maps, side){
  const out = [];
  for(const m of (maps||[])){
    if(m.void) continue;
    const seen = new Set();
    for(const o of sideObs(m, side)){
      const seg = segmentOf(m, o);
      if(seen.has(seg)) continue;
      seen.add(seg);
      const heroes = lineupOf(o);
      if(heroes.length < 2) continue;   // a partial read is not a comp
      out.push({heroes, mapKey:m.id||(m.scrim_id+':'+m.map_no), segment:seg,
                map_name:m.map_name||'?', map_category:m.map_category||'',
                result: resultFor(m, side)});
    }
  }
  return out;
}

// Map results are recorded from OUR point of view, so the opponent's record is
// the mirror of ours. A draw stays a draw.
function resultFor(map, side){
  const r = map.result||null;
  if(side!=='b') return r;
  if(r==='win') return 'loss';
  if(r==='loss') return 'win';
  return r;
}

// Hero pool counted in rounds. Returns {total, counts} where total is the number
// of captured rounds for that side and counts[guid] is how many of them the hero
// appeared in — so "9 of 11 rounds" reads as a staple and "1 of 11" does not.
function heroPool(maps, side){
  const rounds = {};
  for(const m of (maps||[])){
    if(m.void) continue;
    for(const o of sideObs(m, side)){
      const k = (m.id||(m.scrim_id+':'+m.map_no))+':'+obsRound(o);
      if(!rounds[k]) rounds[k] = new Set();
      lineupOf(o).forEach(g=> rounds[k].add(g));
    }
  }
  const counts = {};
  const keys = Object.keys(rounds);
  keys.forEach(k=> rounds[k].forEach(g=>{ counts[g] = (counts[g]||0)+1; }));
  return {total: keys.length, counts};
}

// The enemy lineup at the moment of an observation: their most recent snapshot
// at or before it. That is the state the swap was made against.
function enemyAt(oppObs, o){
  const r = obsRound(o), t = o.ts||0;
  let best = null;
  for(const e of oppObs){
    const er = obsRound(e), et = e.ts||0;
    if(er > r) break;
    if(er === r && et > t) break;
    best = e;
  }
  return best ? lineupOf(best) : [];
}

// Mid-map changes for one side of one map, classified flex (same comp) vs core
// (different comp), with the enemy lineup they were made against.
//
// CAVEAT: the league pipeline confirms a swap through player identity, so a
// substitution is never misread as a tactical swap. Scrim capture cannot do that
// yet — HUD name reading is unreliable (design phase 2b) — so this is a pure
// hero-set difference. In a scrim block, where the five players rarely change
// mid-map, that is usually the same thing; it is not guaranteed to be.
function swapEvents(map, side, roles){
  const own = sideObs(map, side);
  const opp = sideObs(map, side==='a'?'b':'a');
  const evs = [];
  for(let i=1;i<own.length;i++){
    // Within a segment only. Across a segment boundary a different lineup is a
    // new OPENER — chosen for the next point, or for the other half of an
    // attack/defend map — not a mid-map answer to what the enemy was doing.
    // Counting those inflates "core swaps" with every ordinary comp choice.
    if(segmentOf(map, own[i]) !== segmentOf(map, own[i-1])) continue;
    const prev = lineupOf(own[i-1]), curr = lineupOf(own[i]);
    if(prev.join(',')===curr.join(',')) continue;
    // A partial read looks like four heroes leaving at once. Comparing unequal
    // lineup sizes would manufacture swaps out of missed portraits.
    if(prev.length!==curr.length) continue;
    const ps = new Set(prev), cs = new Set(curr);
    const gone = prev.filter(h=> !cs.has(h));
    const came = curr.filter(h=> !ps.has(h));
    if(!gone.length || !came.length) continue;
    evs.push({out:gone, in:came, kind: sameComp(prev,curr,roles)?'flex':'core',
              vs: enemyAt(opp, own[i])});
  }
  return evs;
}

// Recurring swaps across every map, led by their trigger.
//
// Baseline subtraction: an enemy hero fielded in nearly every snapshot is not a
// trigger, it is just always there. A candidate is only reported when its
// presence rate AT the swap beats its rate across all of this side's snapshots.
function aggregateSwaps(maps, side, roles){
  const agg = {};
  const base = {};
  let baseTotal = 0;
  for(const m of (maps||[])){
    if(m.void) continue;
    const own = sideObs(m, side);
    const opp = sideObs(m, side==='a'?'b':'a');
    own.forEach(o=>{
      new Set(enemyAt(opp, o)).forEach(g=>{ base[g] = (base[g]||0)+1; });
      baseTotal++;
    });
    swapEvents(m, side, roles).forEach(ev=>{
      const key = ev.out.join('+')+'>'+ev.in.join('+')+':'+ev.kind;
      if(!agg[key]) agg[key] = {out:ev.out, in:ev.in, kind:ev.kind, count:0, vs:{}, maps:new Set()};
      const slot = agg[key];
      slot.count++;
      slot.maps.add(m.map_name||m.id);
      new Set(ev.vs).forEach(g=>{ slot.vs[g] = (slot.vs[g]||0)+1; });
    });
  }
  return Object.keys(agg).map(k=>{
    const s = agg[k], n = s.count;
    const ranked = Object.keys(s.vs).sort((a,b)=> s.vs[b]-s.vs[a] || a.localeCompare(b));
    let vs;
    if(n===1){
      // A one-off has an exact enemy lineup — showing it beats losing the cause
      // to a majority threshold that needs two occurrences to clear.
      vs = ranked;
    }else{
      const thresh = Math.max(2, Math.floor((n+1)/2));
      vs = ranked.filter(g=> s.vs[g]>=thresh &&
        (!baseTotal || (s.vs[g]/n) > ((base[g]||0)/baseTotal)));
    }
    return {out:s.out, in:s.in, kind:s.kind, count:n, maps:[...s.maps], vs:vs.slice(0,5)};
  }).sort((a,b)=> (b.count-a.count) || (b.in.length-a.in.length));
}

// Per map: what they opened each segment on, and the swaps seen on that map.
function mapBreakdown(maps, side, roles){
  const by = {};
  for(const m of (maps||[])){
    if(m.void) continue;
    const name = m.map_name||'?';
    if(!by[name]) by[name] = {name, category:m.map_category||'', plays:0, segments:{}, swaps:[], maps:[]};
    by[name].plays++;
    by[name].maps.push(m);
  }
  Object.keys(by).forEach(name=>{
    const b = by[name];
    compInstances(b.maps, side).forEach(i=>{
      if(!b.segments[i.segment]) b.segments[i.segment] = [];
      b.segments[i.segment].push(i);
    });
    Object.keys(b.segments).forEach(seg=>{
      b.segments[seg] = clusterComps(b.segments[seg], roles);
    });
    b.swaps = aggregateSwaps(b.maps, side, roles);
  });
  return Object.values(by).sort((a,b)=> b.plays-a.plays || a.name.localeCompare(b.name));
}

// ---------- bans ----------
// A map's bans: [{g, n, by:'us'|'them'|null}]. Some teams scrim with hero bans
// and some do not, so every one of these degrades to nothing rather than
// pretending a team that never bans has a ban profile.
//
// Scrim capture does NOT record draft ORDER — the operator adds bans as they
// notice them — so there is no "first ban" here, only preferred bans. Claiming
// an order the capture never recorded would be the more useful-looking lie.
function mapBans(map){
  return (map.bans||[]).filter(b=> b && b.g);
}

// Maps where bans were RECORDED — the denominator every ban rate divides by.
// Two things count: a map with bans on it, and a map the operator explicitly
// marked as played without any. The second is why `no_bans` exists at all: an
// empty list on its own is indistinguishable from a map nobody recorded bans
// for, so both used to be excluded, and every rate was computed against too
// small a pool.
function bannedMaps(maps){
  return (maps||[]).filter(m=> !m.void && (mapBans(m).length || m.no_bans));
}

// Heroes banned most often, optionally by one side only. The denominator is
// maps where bans were recorded at all — a map captured without them is not
// evidence that nothing was banned.
function banPreferences(maps, by){
  const pool = bannedMaps(maps);
  const counts = {};
  pool.forEach(m=>{
    const gs = new Set(mapBans(m).filter(b=> !by || b.by===by).map(b=>b.g));
    gs.forEach(g=>{ counts[g] = (counts[g]||0)+1; });
  });
  return {
    maps: pool.length,
    rows: Object.keys(counts).sort((a,b)=> counts[b]-counts[a] || a.localeCompare(b))
      .map(g=> ({guid:g, count:counts[g]})),
  };
}

// The record on maps where a hero was banned out, from `side`'s point of view.
// Reads as "with Sojourn gone we are 4-1", which is the decision the operator
// is actually making when they choose what to ban.
function banRecord(maps, side){
  const acc = {};
  bannedMaps(maps).forEach(m=>{
    const r = resultFor(m, side);
    new Set(mapBans(m).map(b=>b.g)).forEach(g=>{
      if(!acc[g]) acc[g] = {guid:g, maps:0, wins:0, losses:0, draws:0};
      acc[g].maps++;
      if(r==='win') acc[g].wins++; else if(r==='loss') acc[g].losses++;
      else if(r==='draw') acc[g].draws++;
    });
  });
  return Object.values(acc).sort((a,b)=> b.maps-a.maps ||
    a.guid.localeCompare(b.guid));
}

// How a side opens when a given hero is banned. Only heroes banned on at least
// `minMaps` maps: one map is an anecdote, and presenting it as a read on their
// draft would be worse than saying nothing.
const BAN_RESPONSE_MIN_MAPS = 2;
function banResponse(maps, side, roles, minMaps){
  const need = minMaps || BAN_RESPONSE_MIN_MAPS;
  const byBan = {};
  bannedMaps(maps).forEach(m=>{
    const insts = compInstances([m], side);
    if(!insts.length) return;
    new Set(mapBans(m).map(b=>b.g)).forEach(g=>{
      (byBan[g] = byBan[g] || []).push(...insts);
    });
  });
  return Object.keys(byBan).map(g=>{
    const insts = byBan[g];
    const n = new Set(insts.map(i=> i.mapKey)).size;
    return {guid:g, maps:n, opens: clusterComps(insts, roles).slice(0,3)};
  }).filter(r=> r.maps >= need)
    .sort((a,b)=> b.maps-a.maps || a.guid.localeCompare(b.guid));
}

// Only the heroes that actually changed. Repeating four unchanged portraits
// buries the one that matters — the same reason the Scout map cards do it.
function compDelta(from, to){
  const f = new Set(from), t = new Set(to);
  return {out: from.filter(h=>!t.has(h)), in: to.filter(h=>!f.has(h))};
}

// ---------- opponent registry ----------
// Scrim records point at an opponent by id: opponent_team_id for a league team,
// opponent_id for a group we only know locally. Resolving through the registry
// means renaming a group once relabels every scrim against them.
let OPPONENTS = {};
async function loadOpponents(){
  OPPONENTS = {};
  try{ (await idbGetAll('opponents')).forEach(o=>{ OPPONENTS[o.id]=o; }); }catch(e){}
}
function opponentOf(s){
  if(!s) return {label:'Opponent', kind:'unknown', team_id:null};
  if(s.opponent_team_id) return {label:s.opponent||'league team', kind:'league_team', team_id:s.opponent_team_id};
  const g = s.opponent_id && OPPONENTS[s.opponent_id];
  if(g) return {label:g.label||s.opponent||'Opponent', kind:'local_group', team_id:null,
                times_played:g.times_played||1};
  return {label:s.opponent||'Opponent', kind:s.opponent?'named':'unknown', team_id:null};
}
// A league opponent links out to their public profile rather than duplicating
// league analysis here - deliberately deferred in the design until there is
// enough scrim data to make a side-by-side worth reading.
function opponentLabelHtml(s){
  const o = opponentOf(s);
  if(o.kind==='league_team'){
    return `${esc(o.label)} <a class="oppout" href="index.html#scout" title="League team — open their profile on the dashboard">league ↗</a>`;
  }
  if(o.kind==='local_group' && o.times_played>1){
    return `${esc(o.label)} <span class="oppmeta">· ${o.times_played}×</span>`;
  }
  return esc(o.label);
}

// ---------- render helpers ----------
function heroBar(guid, count, total, maxCount){
  const pct = maxCount ? Math.round(100*count/maxCount) : 0;
  const name = heroName(guid);
  const rc = heroRoleClass(guid);
  return `<div class="barrow">
    <span class="lab ${rc}">${esc(name)}</span>
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <span class="barval">${count}</span>
  </div>`;
}

function topHeroes(observations, sideFilter, n){
  const freq = heroFrequency(observations, sideFilter);
  const maxCount = freq.length ? freq[0][1] : 1;
  return freq.slice(0, n||10).map(([g,c])=> heroBar(g, c, null, maxCount)).join('');
}

function statTile(n, label, sub){
  sub = sub||'';
  return `<div class="card tile"><div class="n">${esc(String(n))}</div><div class="l">${esc(label)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>`;
}

// ---------- comp / pool / swap rendering ----------
const ROLE_ORDER = {Tank:0, Damage:1, Support:2};
function byRole(heroes){
  return heroes.slice().sort((a,b)=>
    ((ROLE_ORDER[HERO_ROLE[a]] ?? 3) - (ROLE_ORDER[HERO_ROLE[b]] ?? 3)) ||
    heroName(a).localeCompare(heroName(b)));
}
function heroChip(g){
  return `<span class="chip ${heroRoleClass(g)}">${esc(heroName(g))}</span>`;
}
function compChips(heroes){ return byRole(heroes).map(heroChip).join(''); }

function wlHtml(f){
  const parts = [];
  if(f.wins) parts.push(`<span class="w">${f.wins}W</span>`);
  if(f.losses) parts.push(`<span class="l">${f.losses}L</span>`);
  if(f.draws) parts.push(`<span class="d">${f.draws}D</span>`);
  // No result recorded is not 0-0: saying so would read as "they lost nothing".
  return parts.length ? `<span class="wld">${parts.join(' ')}</span>`
                      : `<span class="cnt">no result</span>`;
}

// Comp families, most-played first. `samples` counts segments, `maps` counts
// distinct maps — a comp run on both halves of one map is one map, two segments.
function compTable(fams, limit){
  if(!fams.length) return '<div class="note">Not enough captured comps yet.</div>';
  return fams.slice(0, limit||6).map(f=>{
    const variants = f.variants.length>1
      ? ` · ${f.variants.length} variations` : '';
    return `<div class="comprow">
      <div class="cchips">${compChips(f.heroes)}</div>
      <div class="cmeta">
        <span>${f.maps} map${f.maps===1?'':'s'}${variants}</span>${wlHtml(f)}
      </div>
    </div>`;
  }).join('');
}

// Hero pool in rounds, split by role. The denominator is what makes it readable:
// "9 of 11 rounds" is a staple, "1 of 11" is a one-off, and both are "1 map".
const STAPLE_SHARE = 0.6;
function poolCards(pool){
  if(!pool.total) return '<div class="note">No rounds captured yet.</div>';
  const groups = {Tank:[], Damage:[], Support:[], Other:[]};
  Object.keys(pool.counts).forEach(g=>{
    (groups[HERO_ROLE[g]] || groups.Other).push([g, pool.counts[g]]);
  });
  const card = (role)=>{
    const rows = groups[role].sort((a,b)=> b[1]-a[1] || heroName(a[0]).localeCompare(heroName(b[0])));
    if(!rows.length) return `<div class="card poolcard"><div class="ph role-${role}">${role}</div>
      <div class="note" style="margin-top:0">None seen</div></div>`;
    const body = rows.map(([g,c])=>{
      const pct = Math.round(100*c/pool.total);
      const staple = c/pool.total >= STAPLE_SHARE ? ' staple' : '';
      return `<div class="barrow${staple}">
        <span class="lab ${heroRoleClass(g)}">${esc(heroName(g))}</span>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        <span class="barval">${c}/${pool.total}</span>
      </div>`;
    }).join('');
    return `<div class="card poolcard"><div class="ph role-${role}">${role}</div>${body}</div>`;
  };
  const extra = groups.Other.length ? card('Other') : '';
  return `<div class="poolgrid">${card('Tank')}${card('Damage')}${card('Support')}${extra}</div>`;
}

// Recurring swaps, led by the trigger — that is the actionable half ("they
// answer a D.Va with this"), so it reads first rather than last.
function swapList(swaps, limit, opts){
  opts = opts||{};
  if(!swaps.length) return '<div class="note">No mid-map swaps captured yet.</div>';
  return swaps.slice(0, limit||8).map(s=>{
    const trig = s.vs.length
      ? `vs <b>${s.vs.map(g=>esc(heroName(g))).join(', ')}</b>`
      : '<span style="color:var(--faint)">no consistent trigger</span>';
    const where = opts.showMaps && s.maps.length
      ? ` · ${esc(s.maps.slice(0,3).join(', '))}` : '';
    return `<div class="swaprow">
      <div class="trig">${trig}</div>
      <div class="chg">${s.out.map(heroChip).join('')}<span class="arw">→</span>${s.in.map(heroChip).join('')}</div>
      <div class="cnt"><span class="kind ${s.kind}">${s.kind}</span> ${s.count}×${where}</div>
    </div>`;
  }).join('');
}

// Swap detection is a hero-set difference, not a player-identity match like the
// league pipeline. Saying so once beats letting someone read a substitution as a
// read on the enemy comp.
function swapCaveat(){
  return `<div class="note">Swaps are detected from hero changes, not player
    identity — a player subbing in on a different hero looks the same as a
    tactical swap.</div>`;
}

// ---------- TABS ----------

// Overview
function renderOverview(data){
  const {scrims, maps, mapsByScrim} = data;
  if(!scrims.length) return emptyState();

  const totalMaps = maps.length;
  const totalObs = allObservations(maps).reduce((sum,o)=> sum+(o.heroes||[]).filter(Boolean).length, 0);
  const dates = scrims.map(s=>s.date||'').filter(Boolean).sort();
  const dateRange = dates.length ? (dates[0]===dates[dates.length-1] ? dshort(dates[0]) : dshort(dates[0])+' → '+dshort(dates[dates.length-1])) : '';

  let html = '<div class="grid cols-4 mt10">';
  html += statTile(scrims.length, 'Scrims recorded');
  html += statTile(totalMaps, 'Maps captured');
  html += statTile(totalObs, 'Hero observations');
  html += statTile(dateRange||'—', 'Date range');
  html += '</div>';

  html += coverageStrip(scrims, maps);

  // Our own side, analysed exactly as an opponent would be. A scrim log is a
  // mirror before it is a scouting tool: what you keep running, and how wide
  // your pool actually is, is the first thing a block is meant to tell you.
  const played = maps.filter(m=>!m.void);
  const ourPool = heroPool(played, 'a');
  const ourFams = clusterComps(compInstances(played, 'a'), HERO_ROLE);
  const ourSwaps = aggregateSwaps(played, 'a', HERO_ROLE);
  if(ourPool.total){
    html += '<div class="section-h"><h2>Our comps</h2>'
         +  `<span class="note">over ${ourPool.total} captured round${ourPool.total===1?'':'s'}</span></div>`;
    html += `<div class="card">${compTable(ourFams, 5)}</div>`;
    html += '<div class="section-h"><h2>Our hero pool</h2>'
         +  '<span class="note">rounds played, not maps</span></div>';
    html += poolCards(ourPool);
    if(ourSwaps.length){
      html += '<div class="section-h"><h2>Our swaps</h2></div>';
      html += `<div class="card">${swapList(ourSwaps, 5, {showMaps:true})}</div>`;
      html += swapCaveat();
    }
  }

  // Recent activity
  html += '<div class="section-h"><h2>Recent activity</h2></div>';
  const recent = scrims.slice(0, 5);
  for(const s of recent){
    const sMaps = mapsByScrim[s.id]||[];
    const sObs = allObservations(sMaps);
    const topH = heroFrequency(sObs).slice(0, 6);
    html += `<div class="card mt10">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <span style="font-weight:650;font-size:14px">${esc(s.team_us||'us')} <span style="color:var(--faint);font-weight:400">vs</span> ${opponentLabelHtml(s)}</span>
        <span style="font-size:12px;color:var(--faint)">${esc(s.date||'')} · ${sMaps.length} map${sMaps.length===1?'':'s'}</span>
      </div>`;
    if(topH.length){
      html += `<div class="mt8" style="display:flex;gap:4px;flex-wrap:wrap">`;
      for(const [g,c] of topH){
        html += `<span class="chip role-${HERO_ROLE[g]||''}">${esc(heroName(g))} <span style="color:var(--faint)">${c}</span></span>`;
      }
      html += '</div>';
    }
    if(s.notes) html += `<div class="mt8" style="font-size:12px;color:var(--muted)">${esc(s.notes)}</div>`;
    html += '</div>';
  }

  return html;
}

// Teams
function renderTeams(data){
  const {scrims, maps, mapsByScrim} = data;
  if(!scrims.length) return emptyState();

  // Build opponent stats
  const teamStats = {};
  for(const s of scrims){
    const opp = opponentOf(s).label||'Unknown';
    if(!teamStats[opp]) teamStats[opp] = {scrims:[], maps:[], observations:[]};
    teamStats[opp].scrims.push(s);
    const sMaps = mapsByScrim[s.id]||[];
    teamStats[opp].maps.push(...sMaps);
    for(const m of sMaps){
      teamStats[opp].observations.push(...(m.observations||[]));
    }
  }

  const entries = Object.entries(teamStats).sort((a,b)=>{
    const aLast = a[1].scrims.map(s=>s.created_at||'').sort().reverse()[0]||'';
    const bLast = b[1].scrims.map(s=>s.created_at||'').sort().reverse()[0]||'';
    return bLast.localeCompare(aLast);
  });

  let html = '', anySwaps = false;
  for(const [opp, ts] of entries){
    const played = ts.maps.filter(m=>!m.void);
    const fams = clusterComps(compInstances(played, 'b'), HERO_ROLE);
    const pool = heroPool(played, 'b');
    const swaps = aggregateSwaps(played, 'b', HERO_ROLE);
    const oursVs = clusterComps(compInstances(played, 'a'), HERO_ROLE);

    html += `<div class="card mt10">
      <div class="section-h" style="margin-top:0;border-bottom:0">
        <h2>${esc(opp)}</h2>
        <span class="note">${played.length} map${played.length===1?'':'s'} · ${ts.scrims.length} scrim${ts.scrims.length===1?'':'s'} · ${pool.total} round${pool.total===1?'':'s'}</span>
      </div>`;

    html += '<div class="eyebrow mt10">Their comps</div>';
    html += compTable(fams);

    html += '<div class="eyebrow mt14">Their hero pool <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint)">— rounds played, not maps</span></div>';
    html += poolCards(pool);

    html += '<div class="eyebrow mt14">Their swaps</div>';
    html += swapList(swaps, 6, {showMaps:true});
    anySwaps = anySwaps || swaps.length > 0;

    html += '<div class="eyebrow mt14">What we ran against them</div>';
    html += compTable(oursVs, 4);

    html += '</div>';
  }
  // Once at the end, not under every team card — the caveat is about how swaps
  // are detected, which does not change from one opponent to the next.
  if(anySwaps) html += swapCaveat();
  return html;
}

// Maps — one card per map, mode-grouped. Openers by segment on the left, the
// swaps seen on that map on the right, mirroring the league Scout map cards.
// Segments matter here: a Hybrid attack comp and a Hybrid defend comp are
// different decisions, and averaging them over the map hides both.
function renderMaps(data){
  const {maps} = data;
  if(!maps.length) return emptyState();

  const categories = ['Control','Escort','Hybrid','Push','Flashpoint'];
  const theirs = mapBreakdown(maps, 'b', HERO_ROLE);
  const ours = {};
  mapBreakdown(maps, 'a', HERO_ROLE).forEach(b=>{ ours[b.name] = b; });

  // Segments read best in the order they are played, not alphabetically.
  const SEG_ORDER = {Attack:0, Defend:1, Map:0};
  const segSort = (a,b)=> ((SEG_ORDER[a] ?? 9)-(SEG_ORDER[b] ?? 9)) || a.localeCompare(b);

  let html = '';
  for(const cat of categories.concat(['Other'])){
    const catMaps = theirs.filter(b=> (cat==='Other' ? !categories.includes(b.category) : b.category===cat));
    if(!catMaps.length) continue;
    html += `<div class="modeh">${esc(cat)}</div>`;
    for(const b of catMaps){
      const mine = ours[b.name] || {segments:{}, swaps:[]};
      const wins = b.maps.filter(m=>m.result==='loss').length;   // their win = our loss
      const losses = b.maps.filter(m=>m.result==='win').length;
      const draws = b.maps.filter(m=>m.result==='draw').length;
      const record = (wins||losses||draws)
        ? ` · <b>${wins}W ${losses}L${draws?' '+draws+'D':''}</b> for them` : '';
      html += `<div class="card mt10">
        <div class="section-h" style="margin-top:0;border-bottom:0">
          <h2>${esc(b.name)}</h2>
          <span class="note">${b.plays} time${b.plays===1?'':'s'}${record}</span>
        </div>
        <div class="grid cols-2" style="margin-top:0">`;

      html += '<div><div class="eyebrow">Their openers</div>';
      const segs = Object.keys(b.segments).sort(segSort);
      if(segs.length){
        for(const seg of segs){
          html += `<div class="segh">${esc(seg)}</div>`;
          html += compTable(b.segments[seg], 3);
        }
      }else{
        html += '<div class="note">No comps captured.</div>';
      }
      html += '</div>';

      html += '<div><div class="eyebrow">Their swaps here</div>';
      html += swapList(b.swaps, 5);
      const mySegs = Object.keys(mine.segments).sort(segSort);
      if(mySegs.length){
        html += '<div class="eyebrow mt14">Our openers</div>';
        for(const seg of mySegs){
          html += `<div class="segh">${esc(seg)}</div>`;
          html += compTable(mine.segments[seg], 2);
        }
      }
      html += '</div></div></div>';
    }
  }
  return html;
}

// Bans — only reachable when some map actually recorded them.
function renderBans(data){
  const maps = data.maps.filter(m=>!m.void);
  const pool = bannedMaps(maps);
  if(!pool.length){
    return `<div class="empty"><h2>No bans recorded</h2>
      <p>Some teams scrim with hero bans and some do not. Turn bans on for a
      scrim in the capture page and the heroes you record here will drive this
      page.</p><a href="capture/scrim.html">Open scrim capture →</a></div>`;
  }

  const barRows = (rows, total)=>{
    if(!rows.length) return '<div class="note">None recorded.</div>';
    const max = rows[0].count;
    return rows.slice(0,10).map(r=>{
      const pct = max ? Math.round(100*r.count/max) : 0;
      return `<div class="barrow">
        <span class="lab ${heroRoleClass(r.guid)}">${esc(heroName(r.guid))}</span>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        <span class="barval">${r.count}/${total}</span>
      </div>`;
    }).join('');
  };

  const theirs = banPreferences(maps, 'them');
  const ourown = banPreferences(maps, 'us');
  const either = banPreferences(maps, null);

  let html = `<div class="note" style="margin-top:0">Across
    <b>${pool.length}</b> map${pool.length===1?'':'s'} where bans were recorded.
    Scrim capture does not record draft order, so these are preferred bans, not
    first bans.</div>`;

  html += '<div class="section-h"><h2>Preferred bans</h2></div>';
  html += '<div class="grid cols-2">';
  html += `<div class="card"><div class="eyebrow">They banned</div>${barRows(theirs.rows, theirs.maps)}</div>`;
  html += `<div class="card"><div class="eyebrow">We banned</div>${barRows(ourown.rows, ourown.maps)}</div>`;
  html += '</div>';
  if(!theirs.rows.length && !ourown.rows.length && either.rows.length){
    html += `<div class="card mt10"><div class="eyebrow">Banned, side not noted</div>
      ${barRows(either.rows, either.maps)}</div>`;
  }

  // Win rate with a hero gone. This is the decision the operator is making when
  // they pick what to ban, so it is stated from our side.
  html += '<div class="section-h"><h2>Our record with a hero banned out</h2>'
       +  '<span class="note">every ban on the map, whoever made it</span></div>';
  const rec = banRecord(maps, 'a');
  if(rec.length){
    html += '<div class="card">' + rec.map(r=>`<div class="comprow">
      <div class="cchips">${heroChip(r.guid)}</div>
      <div class="cmeta"><span>${r.maps} map${r.maps===1?'':'s'}</span>${wlHtml(r)}</div>
    </div>`).join('') + '</div>';
  }else{
    html += '<div class="note">No results recorded on the banned maps yet.</div>';
  }

  // How each side opens once a hero is gone.
  const theirResp = banResponse(maps, 'b', HERO_ROLE);
  const ourResp = banResponse(maps, 'a', HERO_ROLE);
  const respBlock = (rows, who)=>{
    if(!rows.length){
      return `<div class="note">Not enough repeated bans yet — a hero has to be
        banned on ${BAN_RESPONSE_MIN_MAPS} maps before ${who} opening under it
        means anything.</div>`;
    }
    return rows.map(r=>`<div class="card mt10">
      <div class="section-h" style="margin-top:0;border-bottom:0">
        <h2>${esc(heroName(r.guid))} banned</h2>
        <span class="note">${r.maps} map${r.maps===1?'':'s'}</span>
      </div>${compTable(r.opens, 3)}</div>`).join('');
  };
  html += '<div class="section-h"><h2>How they open under a ban</h2></div>';
  html += respBlock(theirResp, 'their');
  html += '<div class="section-h"><h2>How we open under a ban</h2></div>';
  html += respBlock(ourResp, 'our');

  return html;
}

// Scrims
function renderScrims(data){
  const {scrims, mapsByScrim} = data;
  if(!scrims.length) return emptyState();

  let html = '';
  for(const s of scrims){
    const sMaps = mapsByScrim[s.id]||[];
    const sObs = allObservations(sMaps);
    const topH = heroFrequency(sObs).slice(0, 6);
    const scrimId = 'scrim-'+s.id.replace(/[^a-zA-Z0-9]/g,'-');

    html += `<div class="scrim-card" id="${scrimId}">
      <div class="scrim-hd" onclick="toggleScrim('${scrimId}')" aria-expanded="false">
        <div class="sh-teams">${esc(s.team_us||'us')} <span class="sh-vs">vs</span> ${opponentLabelHtml(s)}</div>
        <div class="sh-meta">
          <span class="sh-date">${esc(s.date||'')}</span>
          <span class="chip" style="background:transparent;border-color:var(--line)">${sMaps.length} map${sMaps.length===1?'':'s'}</span>
          <span class="sh-toggle">▾</span>
        </div>
      </div>
      <div class="scrim-body" style="display:none">`;

    if(s.notes){
      html += `<div style="font-size:13px;color:var(--muted);padding-top:4px">${esc(s.notes)}</div>`;
    }

    if(topH.length){
      html += `<div class="mt8" style="display:flex;gap:4px;flex-wrap:wrap">`;
      html += '<span style="font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-right:4px">Top heroes:</span>';
      for(const [g,c] of topH){
        html += `<span class="chip">${esc(heroName(g))} <span style="color:var(--faint)">${c}</span></span>`;
      }
      html += '</div>';
    }

    for(const m of sMaps){
      const totalObs = countObservations(m);
      const ourFreq = heroFrequency(m.observations||[], 'a').slice(0, 5);
      const theirFreq = heroFrequency(m.observations||[], 'b').slice(0, 5);
      const codeStr = m.code ? ` · ${esc(m.code)}` : '';
      const scoreStr = m.score ? ` · ${esc(m.score.us)}-${esc(m.score.them)}` : '';
      const resultStr = m.result ? (m.result === 'win' ? ' · Victory' : (m.result === 'loss' ? ' · Defeat' : ' · Draw')) : '';
      const wipStr = (m.score || m.result) ? ' · <span class="wip">WIP</span>' : '';
      html += `<div class="map-row">
        <div class="mr-hd">
          <span class="mr-name">${esc(m.map_name||'?')}</span>
          <span class="mr-meta">${esc(m.map_category||'')}${codeStr}${scoreStr}${resultStr}${wipStr} · ${(m.observations||[]).length} round${(m.observations||[]).length===1?'':'s'} · ${totalObs} heroes</span>
        </div>`;
      html += '<div class="hero-chips">';
      if(ourFreq.length){
        html += '<span style="font-size:12px;color:var(--good);margin-right:4px">Us:</span>';
        for(const [g,c] of ourFreq){
          html += `<span class="chip">${esc(heroName(g))} <span style="color:var(--faint)">${c}</span></span>`;
        }
      }
      if(ourFreq.length && theirFreq.length) html += '<span style="color:var(--faint);margin:0 4px">|</span>';
      if(theirFreq.length){
        html += '<span style="font-size:12px;color:var(--bad);margin-right:4px">Them:</span>';
        for(const [g,c] of theirFreq){
          html += `<span class="chip">${esc(heroName(g))} <span style="color:var(--faint)">${c}</span></span>`;
        }
      }
      html += '</div></div>';
    }

    html += '</div></div>';
  }
  return html;
}

function toggleScrim(id){
  const card = document.getElementById(id);
  if(!card) return;
  const hd = card.querySelector('.scrim-hd');
  const body = card.querySelector('.scrim-body');
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  hd.setAttribute('aria-expanded', String(!open));
}

function emptyState(){
  return `<div class="empty">
    <h2>No scrims yet</h2>
    <p>Capture your first scrim to see stats here. Everything stays private on this browser.</p>
    <a href="capture/scrim.html">+ Capture a scrim →</a>
    <p class="mt14" style="font-size:13px">Not sure it's worth it?
      <a href="?demo=1">See a filled-in example →</a></p>
  </div>`;
}

// A banner that cannot be mistaken for real data. It names real teams and real
// players, so saying plainly that the results are invented is not decoration -
// someone could otherwise read it as a record of games those teams played.
function demoBanner(){
  return `<div class="demobar">
    <b>Sample data.</b> ${esc(DEMO_NOTE || 'These scrims never happened.')}
    <a href="scrims.html">Leave the demo →</a>
  </div>`;
}

// ---------- routing ----------
const TABS = [
  {id:'overview', label:'Overview', render:d=>renderOverview(d)},
  {id:'teams', label:'Teams', render:d=>renderTeams(d)},
  {id:'maps', label:'Maps', render:d=>renderMaps(d)},
  // Bans are optional in scrims, so this tab appears only once some map has
  // recorded them - a team that never bans should not be shown an empty tab
  // asking why they have no ban profile.
  {id:'bans', label:'Bans', render:d=>renderBans(d), when:d=> bannedMaps(d.maps).length>0},
  {id:'scrims', label:'Scrims', render:d=>renderScrims(d)},
];
// Which tabs this dataset earns. Computed against everything loaded, not the
// current range, so narrowing the period does not make a tab vanish mid-session.
function visibleTabs(){
  return TABS.filter(t=> !t.when || (DATA_ALL && t.when(DATA_ALL)));
}

let DATA = null;        // range-filtered, what the tabs render
let DATA_ALL = null;    // everything loaded, so switching range needs no reload
let HANDLED_HASH = '';

// ---------- date range ----------
// Everything on the page is scoped to a period. A year of scrims can span two
// or three different teams, and mixing them produces hero pools that belong to
// nobody - so the range is a first-class control, not a nicety.
const RANGE_KEY = 'owdb_scrim_range';
const RANGES = [
  {id:'30', label:'Last 30 days', days:30},
  {id:'90', label:'Last 90 days', days:90},
  {id:'season', label:'Last 6 months', days:182},
  {id:'all', label:'All time', days:null},
  {id:'custom', label:'Custom…', days:null},
];
let RANGE = {id:'all', from:'', to:''};
function loadRange(){
  try{ const r = JSON.parse(localStorage.getItem(RANGE_KEY)||'null'); if(r&&r.id) RANGE = r; }catch(e){}
}
function saveRange(){ try{ localStorage.setItem(RANGE_KEY, JSON.stringify(RANGE)); }catch(e){} }
function rangeBounds(){
  if(RANGE.id==='custom') return {from:RANGE.from||'', to:RANGE.to||''};
  const def = RANGES.find(r=>r.id===RANGE.id);
  if(!def || def.days==null) return {from:'', to:''};
  return {from:new Date(Date.now()-def.days*86400000).toISOString().slice(0,10), to:''};
}
function scrimDateOf(s){ return s.date || (s.created_at||'').slice(0,10); }
// Filters the loaded data rather than re-reading storage, so switching range is
// instant and the underlying records are never mutated.
function applyRange(data){
  const {from, to} = rangeBounds();
  if(!from && !to) return data;
  const scrims = data.scrims.filter(s=>{
    const d = scrimDateOf(s); if(!d) return true;      // undated: never hide it
    if(from && d < from) return false;
    if(to && d > to) return false;
    return true;
  });
  const keep = new Set(scrims.map(s=>s.id));
  const maps = data.maps.filter(m=>keep.has(m.scrim_id));
  const mapsByScrim = {};
  maps.forEach(m=>{ (mapsByScrim[m.scrim_id] = mapsByScrim[m.scrim_id]||[]).push(m); });
  Object.keys(mapsByScrim).forEach(id=>mapsByScrim[id].sort((a,b)=>(a.map_no||0)-(b.map_no||0)));
  return {scrims, maps, mapsByScrim};
}
// Re-render the current tab after a range change. Cheap: the data is already
// in memory, so this filters rather than re-reads storage.
function wireRangeBar(tabId){
  const sel = document.getElementById('rgsel');
  if(sel) sel.onchange = () => {
    RANGE = {id:sel.value, from:RANGE.from, to:RANGE.to};
    saveRange(); show(tabId);
  };
  ['rgfrom','rgto'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onchange = () => {
      RANGE = {id:'custom', from:(document.getElementById('rgfrom')||{}).value||'',
                             to:(document.getElementById('rgto')||{}).value||''};
      saveRange(); show(tabId);
    };
  });
}

function renderRangeBar(){
  const b = rangeBounds();
  const opts = RANGES.map(r=>`<option value="${r.id}"${RANGE.id===r.id?' selected':''}>${esc(r.label)}</option>`).join('');
  const custom = RANGE.id==='custom'
    ? `<input type="date" id="rgfrom" value="${esc(RANGE.from||'')}" aria-label="From">
       <span class="rgdash">to</span>
       <input type="date" id="rgto" value="${esc(RANGE.to||'')}" aria-label="To">`
    : '';
  const total = DATA_ALL ? DATA_ALL.scrims.length : 0;
  const shown = DATA ? DATA.scrims.length : 0;
  const count = (total && shown!==total) ? `<span class="rgcount">${shown} of ${total} scrims</span>` : '';
  return `<div class="rangebar">
    <label class="rglab" for="rgsel">Period</label>
    <select id="rgsel">${opts}</select>${custom}${count}</div>`;
}

function show(id){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  const c = document.getElementById('content');
  const vis = visibleTabs();
  const tab = vis.find(t=>t.id===id)||vis[0];
  DATA = applyRange(DATA_ALL);
  c.innerHTML = (DEMO?demoBanner():'') + renderRangeBar() + tab.render(DATA);
  wireRangeBar(id);
  try{window.scrollTo(0,0)}catch(e){}
  HANDLED_HASH = '#'+id;
  if(location.hash !== HANDLED_HASH) location.hash = id;
}

function hashDispatch(){
  const h = location.hash||'#overview';
  if(h === HANDLED_HASH) return;
  const id = h.slice(1);
  const valid = visibleTabs().some(t=>t.id===id);
  show(valid?id:'overview');
}

// ---------- boot ----------
async function boot(){
  // Data first: which tabs exist depends on what was captured.
  DATA_ALL = await loadData();
  DATA = DATA_ALL;

  const nav = document.getElementById('nav');
  visibleTabs().forEach(t=>{
    const b = el(`<button data-id="${t.id}">${esc(t.label)}</button>`);
    b.onclick = ()=>show(t.id);
    nav.appendChild(b);
  });

  hashDispatch();
}

window.addEventListener('hashchange', hashDispatch);

// Palette picker — shares owdb.palette with the dashboard (same origin).
(()=>{ const PALETTES=['original','violet','ocean','forest','sunset','teal','overwatch'];
  const pal=document.getElementById('palette');
  pal.value=document.documentElement.getAttribute('data-palette')||'original';
  pal.onchange=()=>{ const v=PALETTES.indexOf(pal.value)>=0?pal.value:'original';
    try{ localStorage.setItem('owdb.palette',v); }catch(e){}
    document.documentElement.setAttribute('data-palette',v); }; })();

boot().catch(err=>{
  document.getElementById('content').innerHTML = '<div class="note" style="padding:24px">Could not read scrim data ('+esc(err.message||err)+').</div>';
});
</script>
</body>
</html>
