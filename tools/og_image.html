<!doctype html>
<!-- Source for docs/og.png (the link-embed card, 1200x630).
     Regenerate after any branding change:
       node tools/shoot_og.js
     which serves the repo root and screenshots this file at 1200x630.
     Colours are the theme.css dark-palette tokens and the fonts are the real
     Space Grotesk / Inter files, so the card matches the live site header. -->
<meta charset="utf-8">
<title>owdb — og card</title>
<style>
  @font-face{font-family:'Space Grotesk';font-weight:700;src:url('../docs/fonts/space-grotesk-700.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-weight:400;src:url('../docs/fonts/inter-400.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-weight:600;src:url('../docs/fonts/inter-600.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-weight:700;src:url('../docs/fonts/inter-700.woff2') format('woff2')}

  /* theme.css dark palette */
  :root{--bg:#0d1015;--fg:#e7ebf2;--muted:#98a2b2;--faint:#6b7686;
        --line:#252c37;--accent:#8087ff;--accent-bright:#a5abff}

  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:var(--bg);overflow:hidden;position:relative;
       font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* concentric-ring motif, carried over from the previous card for continuity */
  .rings{position:absolute;right:-90px;top:50%;transform:translateY(-50%);
         width:660px;height:660px}
  .rings i{position:absolute;border-radius:50%;border:2px solid var(--line);
           top:50%;left:50%;transform:translate(-50%,-50%);display:block}
  .r1{width:640px;height:640px}
  .r2{width:470px;height:470px;border-color:#2c3446 !important}
  .r3{width:300px;height:300px;border-color:#39435c !important}
  .dot{width:86px;height:86px;background:var(--accent);border:0 !important;
       box-shadow:0 0 90px 18px rgba(128,135,255,.30)}
  .glow{position:absolute;right:60px;top:50%;transform:translateY(-50%);
        width:700px;height:700px;border-radius:50%;
        background:radial-gradient(circle,rgba(128,135,255,.10) 0%,transparent 62%)}

  .wrap{position:absolute;left:88px;top:50%;transform:translateY(-50%);max-width:700px}
  .eyebrow{font-size:21px;font-weight:600;letter-spacing:.30em;color:var(--accent);
           text-transform:uppercase;margin-bottom:26px}
  .wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:124px;
            line-height:1;letter-spacing:.01em;margin-bottom:30px;white-space:nowrap}
  .wordmark .br{color:var(--accent)}
  .wordmark .ow{color:var(--accent-bright)}
  .wordmark .db{color:var(--faint)}
  .tag{font-size:29px;line-height:1.42;color:var(--muted);max-width:640px}
  .url{position:absolute;left:88px;bottom:74px;font-size:23px;font-weight:700;
       color:var(--accent-bright);letter-spacing:.01em}
</style>

<div class="glow"></div>
<div class="rings">
  <i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="dot"></i>
</div>

<div class="wrap">
  <div class="eyebrow">FACEIT League &middot; Overwatch 2</div>
  <div class="wordmark"><span class="br">[</span><span class="ow">ow</span><span class="db">db</span><span class="br">]</span></div>
  <div class="tag">Composition scouting: hero comps, bans, map picks &amp; a draft simulator for every team.</div>
</div>
<div class="url">owdb.io</div>
