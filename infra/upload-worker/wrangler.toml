name = "owdb-upload"
main = "worker.js"
compatibility_date = "2026-07-01"

[vars]
REPO = "ccarney651/faceit-scout"
# DENYLIST = "somename,othername"   # optional, comma-separated

# Discord login (scaffold - stays OFF until all four are present). Uncomment and
# set this to the deployed callback URL when you create the Discord app:
# DISCORD_REDIRECT_URI = "https://upload.owdb.io/auth/callback"
# Admin roster access (/admin/contributors): comma-separated Discord user ids.
# ADMIN_IDS = "your_discord_user_id"

# owdb.io custom domain for this Worker (requires the owdb.io zone in Cloudflare).
# Cloudflare auto-creates the DNS record + certificate for upload.owdb.io on deploy.
[[routes]]
pattern = "upload.owdb.io"
custom_domain = true

# After `wrangler kv namespace create NAMES`, paste the id here:
[[kv_namespaces]]
binding = "NAMES"
id = "8230bf3bec1d424da7d07a6e7eb4cb19"

# Live scouting claims - one global Durable Object holds the claim room and each
# scout's WebSocket. SQLite-backed = available on the Workers Free plan (no
# duration charge while sockets hibernate; free-plan SQLite storage isn't billed).
[[durable_objects.bindings]]
name = "CLAIM_ROOM"
class_name = "ClaimRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClaimRoom"]

# Secrets (set with `wrangler secret put <NAME>`):
#   GITHUB_TOKEN     fine-grained PAT, Contents read/write, the site repo only
#   DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRET   from the Discord app (login scaffold)
#   SESSION_SECRET   any long random string, signs the login session tokens
