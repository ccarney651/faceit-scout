[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceit-sync"
version = "0.1.0"
description = "Incremental, idempotent ingest of FACEIT League (Overwatch 2) championship data into SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "mypy>=1.8",
    "types-requests>=2.31",
    "ruff>=0.6",
]
# owdb (sibling tool) screen-capture / CV runtime deps. Optional so the
# faceit-sync install and test suite need none of them; imported lazily.
capture = [
    "dxcam>=0.0.5",
    "mss>=9.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "keyboard>=0.13",
    "winsdk>=1.0.0b10",   # Windows built-in OCR for auto side-detection (no stable release yet)
]

[project.scripts]
faceit-sync = "faceit_sync.cli:main"
owdb = "owdb.cli:main"

[tool.setuptools.packages.find]
include = ["faceit_sync*", "owdb*"]

# The inlined hero portraits ship with the package: a build without them renders
# a portrait-less dashboard, which is a silent visual regression rather than an
# error. Regenerate with `python -m faceit_sync.hero_icons <asset-dir>`.
[tool.setuptools.package-data]
faceit_sync = [
    "hero_icons.json",
    # The dashboard's template is assembled from these static parts at import
    # (see _dashboard.py); a wheel needs them alongside the module.
    "dashboard/*.html",
    "dashboard/*.js",
]

[tool.mypy]
# Analysis targets 3.12 (the dev/CI interpreter, and what numpy's current stubs
# require); runtime floor stays 3.11 via requires-python.
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# The SQLite rows we read back are Any-typed by nature; keep those localized.
warn_return_any = false

# owdb's capture stack ships no usable stubs (and numpy's are 3.12-only
# syntax that trips a 3.11-targeted check), so skip following them entirely.
[[tool.mypy.overrides]]
module = ["cv2", "dxcam", "mss", "numpy", "numpy.*", "keyboard"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
# Same ceiling as the codebase's line-wrapping habits.
line-length = 100

[tool.ruff.lint]
# Default rule set minus the pedantic stylistic ones that would churn every
# diff for no behavioral gain; B (bugbear) is kept on because it flags the
# broad-except/f-string pitfalls the review cares about.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    # The dashboard parts and capture app are concatenated/build artifacts, not
    # hand-linted modules - leave their style alone.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# F401: hero_icons/team_logos keep module-level imports for CLI convenience.
"faceit_sync/__init__.py" = ["F401"]
"faceit_sync/hero_icons.py" = ["F401"]
# E402: cv2 is importorskip'd before the owdb imports it needs.
"tests/test_ref_import_rescale.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests", "owdb/tests"]
addopts = "-q"
